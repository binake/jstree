        async function saveExtrasData() {
            try {
                console.log('Saving extras data...', extrasState);
                extrasState.autoBoundaries = document.getElementById('auto_boundary_toggle').checked;
                const extraDataStr = JSON.stringify(extrasState);

                if (jm && jm.mind && jm.mind.meta) {
                    jm.mind.meta.extra_data = extraDataStr;
                }

                if (!currentTreeId) {
                    alert('错误：当前技能树 ID 未找到，请重新加载页面。');
                    return;
                }

                const resp = await fetch(`${API_BASE}/trees/${currentTreeId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ extra_data: extraDataStr })
                });

                if (resp.ok) {
                    alert('保存成功！可以在展示页面查看效果。');
                    if (typeof renderExtrasInAdmin === 'function') renderExtrasInAdmin();
                    closeExtrasManager();
                } else {
                    const err = await resp.json();
                    alert('保存失败: ' + (err.error || '服务器响应错误'));
                }
            } catch (e) {
                console.error('Save extras error:', e);
                alert('保存出错: ' + e.message);
            }
        }

        // --- 管理页渲染引擎 (Canvas Drawing) ---
        function renderExtrasInAdmin() {
            if (!jm || !jm.view || !extrasState) return;
            const canvas = jm.view.graph?.e_canvas || jm.view.canvas;
            const ctx = jm.view.graph?.canvas_ctx || (canvas ? canvas.getContext('2d') : null);
            if (!canvas || !ctx) return;

            // 注意：jsMind 可能已经绘制了连线，我们需要在上面叠加
            // 简单的做法是直接画。如果需要清除之前的，jsMind 通常在 redraw 被调用时会清除。

            // 1. 自动外框
            if (extrasState.autoBoundaries !== false) {
                const moduleGroups = {};
                Object.values(jm.mind.nodes).forEach(node => {
                    const mod = node.data.module;
                    if (mod && mod !== '默认模块') {
                        if (!moduleGroups[mod]) moduleGroups[mod] = [];
                        moduleGroups[mod].push(node.id);
                    }
                });
                Object.keys(moduleGroups).forEach(mod => {
                    drawBoundaryInAdmin(ctx, {
                        nodes: moduleGroups[mod],
                        topic: mod,
                        color: 'rgba(128, 128, 128, 0.4)',
                        bgColor: 'rgba(128, 128, 128, 0.02)'
                    });
                });
            }

            // 2. 手动外框
            if (extrasState.boundaries) {
                extrasState.boundaries.forEach(b => drawBoundaryInAdmin(ctx, b));
            }

            // 3. 联系线
            if (extrasState.relationships) {
                extrasState.relationships.forEach(r => drawRelationshipInAdmin(ctx, r));
            }
        }

        function addNodeInfoIcon(nodeId) {
            if (!jm || !jm.mind) return;
            const node = jm.get_node(nodeId);
            if (!node || !node._data || !node._data.view || !node._data.view.element) {
                setTimeout(() => addNodeInfoIcon(nodeId), 100);
                return;
            }
            const element = node._data.view.element;
            if (!element) return;

            let iconElement = element.querySelector('.node-info-icon');
            if (iconElement) iconElement.remove();

            const nodeData = node.data || {};
            const hasDescription = nodeData.description && nodeData.description.trim();
            const hasLink = (nodeData.link && nodeData.link.trim()) || (nodeData.link2 && nodeData.link2.trim());

            if (hasDescription || hasLink) {
                iconElement = document.createElement('div');
                iconElement.className = 'node-info-icon';

                let icons = "";
                if (hasDescription) icons += "📝";
                if (hasLink) icons += "🔗";
                iconElement.textContent = icons;

                iconElement.title = (hasDescription ? '有说明信息\n' : '') + (hasLink ? '有链接信息' : '');
                element.appendChild(iconElement);
            }
        }

        function drawBoundaryInAdmin(ctx, boundary) {
            if (!boundary.nodes || boundary.nodes.length === 0) return;
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            let found = false;
            boundary.nodes.forEach(id => {
                const node = jm.get_node(id);
                if (node) {
                    const loc = node.get_location();
                    const size = node.get_size();
                    minX = Math.min(minX, loc.x);
                    minY = Math.min(minY, loc.y);
                    maxX = Math.max(maxX, loc.x + size.w);
                    maxY = Math.max(maxY, loc.y + size.h);
                    found = true;
                }
            });
            if (!found) return;
            const padding = 15;
            minX -= padding; minY -= padding; maxX += padding; maxY += padding;

            if (boundary.style === 'brace' || boundary.style === 'bracket' || boundary.style === 'curved') {
                ctx.save();
                ctx.strokeStyle = boundary.color || 'rgba(168, 85, 247, 0.8)';
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                const midY = (minY + maxY) / 2;
                const braceX = maxX + 4;
                const tipX = braceX + 10;
                ctx.beginPath();
                if (boundary.style === 'brace') {
                    ctx.moveTo(maxX, minY + 5);
                    ctx.quadraticCurveTo(braceX, minY + 5, braceX, minY + 20);
                    ctx.lineTo(braceX, midY - 15);
                    ctx.quadraticCurveTo(braceX, midY, tipX, midY);
                    ctx.quadraticCurveTo(braceX, midY, braceX, midY + 15);
                    ctx.lineTo(braceX, maxY - 20);
                    ctx.quadraticCurveTo(braceX, maxY - 5, maxX, maxY - 5);
                } else if (boundary.style === 'bracket') {
                    ctx.moveTo(maxX, minY + 5); ctx.lineTo(braceX, minY + 5);
                    ctx.lineTo(braceX, maxY - 5); ctx.lineTo(maxX, maxY - 5);
                    ctx.moveTo(braceX, midY); ctx.lineTo(tipX, midY);
                } else {
                    ctx.moveTo(maxX, minY + 5); ctx.quadraticCurveTo(tipX, midY, maxX, maxY - 5);
                }
                ctx.stroke();
                if (boundary.topic) {
                    ctx.save();
                    const fontSize = boundary.fontSize || 14;
                    ctx.font = `bold ${fontSize}px "Inter", sans-serif`;
                    const textWidth = ctx.measureText(boundary.topic).width;
                    const textHeight = fontSize;

                    // 绘制文字背景 (Pill Shape)
                    ctx.fillStyle = 'rgba(20, 20, 20, 0.6)';
                    const bgX = tipX + 8;
                    const bgY = midY - textHeight / 2 - 6;
                    const bgW = textWidth + 16;
                    const bgH = textHeight + 10;
                    const radius = bgH / 2;

                    ctx.beginPath();
                    ctx.moveTo(bgX + radius, bgY);
                    ctx.arcTo(bgX + bgW, bgY, bgX + bgW, bgY + bgH, radius);
                    ctx.arcTo(bgX + bgW, bgY + bgH, bgX, bgY + bgH, radius);
                    ctx.arcTo(bgX, bgY + bgH, bgX, bgY, radius);
                    ctx.arcTo(bgX, bgY, bgX + bgW, bgY, radius);
                    ctx.closePath();
                    ctx.fill();

                    // 绘制文字
                    ctx.fillStyle = boundary.color || 'rgb(168, 85, 247)';
                    ctx.fillText(boundary.topic, bgX + 8, midY + textHeight / 2 - 2);
                    ctx.restore();
                }
                ctx.restore();
                return;
            }

            if (boundary.style === 'cloud') {
                ctx.save();
                ctx.beginPath();
                ctx.strokeStyle = boundary.color || 'rgba(236, 72, 153, 0.6)';
                ctx.lineWidth = 2;
                const step = 20;
                for (let x = minX; x < maxX; x += step) ctx.arc(x + step / 2, minY, step / 2 + 2, Math.PI, 0, false);
                for (let y = minY; y < maxY; y += step) ctx.arc(maxX, y + step / 2, step / 2 + 2, -Math.PI / 2, Math.PI / 2, false);
                for (let x = maxX; x > minX; x -= step) ctx.arc(x - step / 2, maxY, step / 2 + 2, 0, Math.PI, false);
                for (let y = maxY; y > minY; y -= step) ctx.arc(minX, y - step / 2, step / 2 + 2, Math.PI / 2, -Math.PI / 2, false);
                ctx.stroke();

                // 使用 destination-over 确保背景在连线下方
                ctx.save();
                ctx.globalCompositeOperation = 'destination-over';
                ctx.fillStyle = boundary.bgColor || 'rgba(236, 72, 153, 0.12)';
                ctx.fill();
                ctx.restore();

                if (boundary.topic) {
                    ctx.save();
                    const fontSize = boundary.fontSize || 14;
                    ctx.font = `bold ${fontSize}px "Inter", sans-serif`;
                    const textWidth = ctx.measureText(boundary.topic).width;
                    const textHeight = fontSize;

                    // 绘制文字背景 (Pill Shape)
                    ctx.fillStyle = 'rgba(20, 20, 20, 0.6)';
                    const bgX = minX + 8;
                    const bgY = minY - textHeight - 12;
                    const bgW = textWidth + 16;
                    const bgH = textHeight + 8;
                    const radius = bgH / 2;

                    ctx.beginPath();
                    ctx.moveTo(bgX + radius, bgY);
                    ctx.arcTo(bgX + bgW, bgY, bgX + bgW, bgY + bgH, radius);
                    ctx.arcTo(bgX + bgW, bgY + bgH, bgX, bgY + bgH, radius);
                    ctx.arcTo(bgX, bgY + bgH, bgX, bgY, radius);
                    ctx.arcTo(bgX, bgY, bgX + bgW, bgY, radius);
                    ctx.closePath();
                    ctx.fill();

                    // 绘制文字
                    ctx.fillStyle = boundary.color || '#EC4899';
                    ctx.fillText(boundary.topic, bgX + 8, bgY + textHeight + 2);
                    ctx.restore();
                }
                ctx.restore();
            } else {
                ctx.save();
                ctx.beginPath();
                // 优化：默认使用实线或长虚线，增加设计感
                ctx.strokeStyle = boundary.color || 'rgba(255, 127, 39, 0.8)';
                ctx.lineWidth = 2.5;
                const r = 20; // 增大圆角，更显圆润
                ctx.moveTo(minX + r, minY);
                ctx.arcTo(maxX, minY, maxX, maxY, r);
                ctx.arcTo(maxX, maxY, minX, maxY, r);
                ctx.arcTo(minX, maxY, minX, minY, r);
                ctx.arcTo(minX, minY, maxX, minY, r);
                ctx.closePath();

                // 使用 destination-over 确保背景在连线下方
                ctx.save();
                ctx.globalCompositeOperation = 'destination-over';
                ctx.fillStyle = boundary.bgColor || 'rgba(255, 127, 39, 0.12)';
                ctx.fill();
                ctx.restore();

                ctx.stroke();
                ctx.restore();
            }

            if (boundary.topic && boundary.style !== 'cloud') {
                ctx.save();
                const fontSize = boundary.fontSize || 14;
                ctx.font = `bold ${fontSize}px "Inter", sans-serif`;

                const textWidth = ctx.measureText(boundary.topic).width;
                const textHeight = fontSize;

                // 绘制文字背景背景 (Pill Shape)
                ctx.fillStyle = 'rgba(20, 20, 20, 0.6)';
                const bgX = minX + 8;
                const bgY = minY - textHeight - 12;
                const bgW = textWidth + 16;
                const bgH = textHeight + 8;
                const r = bgH / 2;

                ctx.beginPath();
                ctx.moveTo(bgX + r, bgY);
                ctx.arcTo(bgX + bgW, bgY, bgX + bgW, bgY + bgH, r);
                ctx.arcTo(bgX + bgW, bgY + bgH, bgX, bgY + bgH, r);
                ctx.arcTo(bgX, bgY + bgH, bgX, bgY, r);
                ctx.arcTo(bgX, bgY, bgX + bgW, bgY, r);
                ctx.closePath();
                ctx.fill();

                // 绘制文字
                ctx.fillStyle = boundary.color || 'rgb(207, 77, 12)';
                ctx.fillText(boundary.topic, bgX + 8, bgY + textHeight + 2);
                ctx.restore();
            }
        }

        function drawRelationshipInAdmin(ctx, rel) {
            const nodeFrom = jm.get_node(rel.from);
            const nodeTo = jm.get_node(rel.to);
            if (!nodeFrom || !nodeTo) return;
            const locFrom = nodeFrom.get_location();
            const sizeFrom = nodeFrom.get_size();
            const locTo = nodeTo.get_location();
            const sizeTo = nodeTo.get_size();
            const p1 = { x: locFrom.x + sizeFrom.w / 2, y: locFrom.y + sizeFrom.h / 2 };
            const p2 = { x: locTo.x + sizeTo.w / 2, y: locTo.y + sizeTo.h / 2 };
            ctx.save();
            ctx.beginPath();
            ctx.strokeStyle = rel.color || 'rgba(168, 85, 247, 0.6)';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 3]);
            const dist = Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
            const cp1 = { x: p1.x + (p2.x - p1.x) * 0.2, y: p1.y - dist * 0.2 };
            const cp2 = { x: p1.x + (p2.x - p1.x) * 0.8, y: p2.y - dist * 0.2 };
            ctx.moveTo(p1.x, p1.y);
            ctx.bezierCurveTo(cp1.x, cp1.y, cp2.x, cp2.y, p2.x, p2.y);
            ctx.stroke();

            // 绘制箭头
            const angle = Math.atan2(p2.y - cp2.y, p2.x - cp2.x);
            ctx.beginPath();
            ctx.setLineDash([]);
            ctx.fillStyle = rel.color || 'rgba(168, 85, 247, 0.8)';
            ctx.moveTo(p2.x, p2.y);
            ctx.lineTo(p2.x - 12 * Math.cos(angle - Math.PI / 8), p2.y - 12 * Math.sin(angle - Math.PI / 8));
            ctx.lineTo(p2.x - 12 * Math.cos(angle + Math.PI / 8), p2.y - 12 * Math.sin(angle + Math.PI / 8));
            ctx.closePath();
            ctx.fill();

            // 绘制关系名称标签 (Pill Shape)
            if (rel.topic) {
                const midX = (cp1.x + cp2.x) / 2;
                const midY = (cp1.y + cp2.y) / 2;
                ctx.save();
                ctx.font = 'bold 12px "Inter", sans-serif';
                const textWidth = ctx.measureText(rel.topic).width;
                const textHeight = 12;

                // 绘制文字背景 (Premium Pill Shape)
                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                const bgX = midX - textWidth / 2 - 10;
                const bgY = midY - textHeight / 2 - 6;
                const bgW = textWidth + 20;
                const bgH = textHeight + 12;
                const radius = bgH / 2;

                ctx.beginPath();
                ctx.moveTo(bgX + radius, bgY);
                ctx.arcTo(bgX + bgW, bgY, bgX + bgW, bgY + bgH, radius);
                ctx.arcTo(bgX + bgW, bgY + bgH, bgX, bgY + bgH, radius);
                ctx.arcTo(bgX, bgY + bgH, bgX, bgY, radius);
                ctx.arcTo(bgX, bgY, bgX + bgW, bgY, radius);
                ctx.closePath();
                ctx.fill();

                // 增加精细边框
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.fillStyle = rel.color || 'rgb(168, 85, 247)';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(rel.topic, midX, midY);
                ctx.restore();
            }
            ctx.restore();
        }

        // 修改 jsmind 点击监听以支持节点选择
        function setupExtrasJsmindListener() {
            if (!jm) return;
            jm.add_event_listener((type, data) => {
                if (window.isSelectingNodes && type === jMind.event_type.select) {
                    const node = jm.get_selected_node();
                    if (!node) return;

                    // 只有根节点点击会触发结束
                    if (node.id === 'root' && selectionTarget.nodes.length > 0) {
                        window.isSelectingNodes = false;

                        // 清除所有临时高亮
                        selectionTarget.nodes.forEach(id => {
                            const n = jm.get_node(id);
                            if (n && n._data.view.element) n._data.view.element.style.outline = '';
                        });

                        if (selectionTarget.type === 'boundary') {
                            extrasState.boundaries[selectionTarget.index].nodes = [...new Set(selectionTarget.nodes)];
                        } else if (selectionTarget.type === 'relationship') {
                            if (selectionTarget.nodes.length >= 2) {
                                extrasState.relationships[selectionTarget.index].from = selectionTarget.nodes[0];
                                extrasState.relationships[selectionTarget.index].to = selectionTarget.nodes[1];
                            }
                        }
                        openExtrasManager();
                        return;
                    }

                    // 高亮显示已选中的节点
                    const el = node._data.view.element;
                    if (el) el.style.outline = '3px solid var(--cyan)';

                    selectionTarget.nodes.push(node.id);
                    console.log('Selected node for extras:', node.id);
                }
            });
        }

        // 右键菜单管理
        function initContextMenu() {
            const container = document.getElementById('jsmind_container');
            container.addEventListener('contextmenu', (e) => {
                const target = e.target;
                const nodeTag = target.tagName.toLowerCase();
                const nodeElement = target.closest('jmnode');

                if (nodeElement) {
                    e.preventDefault();
                    const nodeId = nodeElement.getAttribute('nodeid');
                    jm.select_node(nodeId);

                    const menu = document.getElementById('node_context_menu');
                    menu.style.display = 'block';
                    menu.style.left = e.clientX + 'px';
                    menu.style.top = e.clientY + 'px';
                } else {
                    closeContextMenu();
                }
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('#node_context_menu')) {
                    closeContextMenu();
                }
            });
        }

        function closeContextMenu() {
            document.getElementById('node_context_menu').style.display = 'none';
        }

        function getAllDescendantIds(nodeId) {
            const node = jm.get_node(nodeId);
            if (!node) return [];
            let result = [nodeId];
            if (node.children) {
                node.children.forEach(child => {
                    result = result.concat(getAllDescendantIds(child.id));
                });
            }
            return result;
        }

        function addBoundaryFromMenu(styleType) {
            const selected = jm.get_selected_node();
            if (!selected) return;

            const nodeIds = getAllDescendantIds(selected.id);

            // 根据风格设置默认颜色 (橙色系)
            let color = 'rgb(207,77,12)';
            let bgColor = 'rgba(251,209,188, 0.08)';
            if (styleType === 'cloud') {
                color = 'rgba(236, 72, 153, 0.8)';
                bgColor = 'rgba(236, 72, 153, 0.05)';
            } else if (styleType === 'brace' || styleType === 'bracket') {
                color = 'rgba(168, 85, 247, 0.8)';
                bgColor = 'transparent';
            }

            const newBoundary = {
                topic: (styleType === 'brace' || styleType === 'bracket') ? '概要总结' : '分组外框',
                nodes: nodeIds,
                style: styleType,
                color: color,
                bgColor: bgColor,
                fontSize: 14
            };

            extrasState.boundaries.push(newBoundary);
            closeContextMenu();
            openExtrasManager();
        }

        function startRelationshipFromMenu() {
            const selected = jm.get_selected_node();
            if (!selected) return;

            closeContextMenu();
            const relIndex = extrasState.relationships.length;
            addRelationshipUI();

            // 自动把当前节点设为源
            extrasState.relationships[relIndex].from = selected.id;
            selectionTarget.nodes = [selected.id];

            // 高亮当前节点
            const el = selected._data.view.element;
            if (el) el.style.outline = '3px solid var(--purple)';

            alert(`已连接源节点: ${selected.topic}，请点击目标节点进行连接。`);
        }

        // --- 框选 (Lasso Selection) 逻辑 ---
        let isLassoing = false;
        let lassoStart = { x: 0, y: 0 };
        let lassoSelectedNodeIds = [];

        function initLassoSelection() {
            const container = document.getElementById('jsmind_container');
            const overlay = document.getElementById('selection_overlay');

            container.addEventListener('mousedown', (e) => {
                 // 抓手模式下禁用框选
                 if (currentMode === 'hand') return;
                // 如果点击的是节点、滚动条区域或右键，不触发框选
                if (e.target.closest('jmnode') || e.button !== 0) return;

                isLassoing = true;
                lassoStart = { x: e.clientX, y: e.clientY };
                lassoSelectedNodeIds = [];

                overlay.style.display = 'block';
                overlay.style.left = e.clientX + 'px';
                overlay.style.top = e.clientY + 'px';
                overlay.style.width = '0px';
                overlay.style.height = '0px';

                // 清掉之前的临时高亮和旧工具栏
                document.querySelectorAll('jmnode').forEach(n => n.style.outline = '');
                document.getElementById('lasso_toolbar').style.display = 'none';
            });

            window.addEventListener('mousemove', (e) => {
                if (!isLassoing) return;

                const current = { x: e.clientX, y: e.clientY };
                const left = Math.min(lassoStart.x, current.x);
                const top = Math.min(lassoStart.y, current.y);
                const width = Math.abs(lassoStart.x - current.x);
                const height = Math.abs(lassoStart.y - current.y);

                overlay.style.left = left + 'px';
                overlay.style.top = top + 'px';
                overlay.style.width = width + 'px';
                overlay.style.height = height + 'px';

                // 实时检测碰撞，提供视觉反馈
                checkLassoCollision(left, top, width, height);
            });

            window.addEventListener('mouseup', (e) => {
                if (!isLassoing) return;
                isLassoing = false;
                overlay.style.display = 'none';

                if (lassoSelectedNodeIds.length > 0) {
                    showLassoToolbar(e.clientX, e.clientY);
                }
            });
        }

        function checkLassoCollision(left, top, width, height) {
            const newSelected = [];
            const nodes = document.querySelectorAll('jmnode');
            nodes.forEach(nodeEl => {
                const rect = nodeEl.getBoundingClientRect();
                const isInside = (
                    rect.left < left + width &&
                    rect.left + rect.width > left &&
                    rect.top < top + height &&
                    rect.top + rect.height > top
                );

                if (isInside) {
                    nodeEl.style.outline = '3px solid var(--cyan)';
                    newSelected.push(nodeEl.getAttribute('nodeid'));
                } else {
                    nodeEl.style.outline = '';
                }
            });
            lassoSelectedNodeIds = newSelected;
        }

        function showLassoToolbar(x, y) {
            const toolbar = document.getElementById('lasso_toolbar');
            toolbar.style.display = 'flex';

            // 考虑溢出边界
            const tbWidth = 240;
            const finalX = Math.min(x, window.innerWidth - tbWidth);
            toolbar.style.left = finalX + 'px';
            toolbar.style.top = (y + 15) + 'px';
        }

        function applyLassoExtras(styleType) {
            if (lassoSelectedNodeIds.length === 0) return;

            let color = 'rgb(207, 77, 12, 0.8)';
            let bgColor = 'rgba(251, 209, 188, 0.15)';
            if (styleType === 'cloud') {
                color = 'rgba(236, 72, 153, 0.8)';
                bgColor = 'rgba(236, 72, 153, 0.1)';
            } else if (styleType === 'brace' || styleType === 'bracket') {
                color = 'rgba(168, 85, 247, 0.8)';
                bgColor = 'transparent';
            }

            const newBoundary = {
                topic: (styleType === 'brace' || styleType === 'bracket') ? '概要总结' : '分组外框',
                nodes: [...lassoSelectedNodeIds],
                style: styleType,
                color: color,
                bgColor: bgColor,
                fontSize: 14
            };

            extrasState.boundaries.push(newBoundary);
            cancelLassoSelection();
            renderExtrasLists();
            saveExtrasData();
        }

        function cancelLassoSelection() {
            document.querySelectorAll('jmnode').forEach(n => n.style.outline = '');
            document.getElementById('lasso_toolbar').style.display = 'none';
            lassoSelectedNodeIds = [];
        }

        // 初始化
        window.onload = function () {
            initColorPickers();
            initMindMap();
            setupTreeListSearch();
            loadTreeList();
            loadModuleList();
            initContextMenu();
            initLassoSelection();
             initCanvasPan();
             initKeyboardShortcuts();
            // 延迟一点绑定监听，确保 jm 已就绪
            setTimeout(setupExtrasJsmindListener, 1000);

            // 持续渲染循环，防止 jsMind 重绘时擦除我们的自定义渲染
            const loop = () => {
                if (currentTreeId) renderExtrasInAdmin();
                requestAnimationFrame(loop);
            };
            loop();
        };
    </script>
